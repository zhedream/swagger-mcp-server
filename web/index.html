<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP 测试工具</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="toolbar-brand">
          <i class="fas fa-cogs"></i>
          <span>MCP 测试</span>
        </div>
        <div class="status-indicator" id="connectionStatus">
          <span class="status-dot disconnected"></span>
          <span class="status-text">未连接</span>
        </div>
        <select
          id="swaggerUrl"
          class="swagger-select"
          aria-label="Swagger 文档"
        >
          <option value="http://127.0.0.1:3000/api.json">api.json</option>
          <option value="http://127.0.0.1:3000/api2.json">api2.json</option>
          <option value="http://172.16.12.219:8808/StationHouse/swagger.json">
            StationHouse
          </option>
          <option value="http://172.16.12.219:8004/swagger/v1/swagger.json">
            Swagger V1
          </option>
          <option value="http://172.16.12.219:8901/AirOps/swagger.json">
            AirOps
          </option>
          <option value="http://172.16.12.52:8099/Car_Center/swagger.json">
            Car Center
          </option>
        </select>
        <button id="connectBtn" class="btn btn-primary">
          <i class="fas fa-play"></i> 启动
        </button>
      </header>

      <div class="workspace">
        <aside class="panel panel-list">
          <div class="panel-header">
            <h2>
              接口
              <span class="meta" id="apiCount">0</span>
            </h2>
            <span class="meta" id="checkedCount">已选 0</span>
          </div>
          <div class="panel-toolbar">
            <input
              type="text"
              id="apiSearchInput"
              class="search-input"
              placeholder="过滤路径 / 名称，空格 AND"
            />
            <div class="panel-actions">
              <button
                type="button"
                id="batchQueryBtn"
                class="btn btn-success btn-small"
                disabled
              >
                <i class="fas fa-layer-group"></i> 批量查询
              </button>
              <button
                type="button"
                id="refreshApisBtn"
                class="btn btn-primary btn-small"
              >
                <i class="fas fa-sync-alt"></i> 刷新
              </button>
              <button
                type="button"
                id="selectFilteredBtn"
                class="btn btn-secondary btn-small"
              >
                全选当前
              </button>
              <button
                type="button"
                id="clearApiChecksBtn"
                class="btn btn-secondary btn-small"
              >
                取消勾选
              </button>
            </div>
          </div>
          <div id="apiList" class="api-list">
            <div class="empty-state">等待连接 MCP 服务器...</div>
          </div>
        </aside>

        <section class="panel panel-main">
          <div class="panel-header">
            <div class="tabs" role="tablist">
              <button
                type="button"
                class="tab active"
                data-pane="results"
                role="tab"
              >
                查询结果
              </button>
              <button type="button" class="tab" data-pane="tools" role="tab">
                工具
              </button>
              <button type="button" class="tab" data-pane="logs" role="tab">
                日志
              </button>
            </div>
            <div class="result-actions">
              <button
                id="toggleFormatBtn"
                class="btn btn-secondary btn-small"
                hidden
              >
                <i class="fas fa-indent"></i> 格式化
              </button>
              <button
                id="copyResultBtn"
                class="btn btn-secondary btn-small"
                hidden
              >
                <i class="fas fa-copy"></i> 复制
              </button>
              <button
                id="copyCompactBtn"
                class="btn btn-secondary btn-small"
                hidden
              >
                <i class="fas fa-compress"></i> 压缩复制
              </button>
              <button id="clearLogs" class="btn btn-secondary btn-small" hidden>
                <i class="fas fa-trash"></i> 清空日志
              </button>
            </div>
          </div>

          <div class="pane active" id="pane-results">
            <div id="results" class="results-container">
              <div class="empty-state">
                点击左侧接口查看详情，或勾选后批量查询
              </div>
            </div>
          </div>
          <div class="pane" id="pane-tools">
            <div id="toolsList" class="tools-list">
              <div class="empty-state">等待连接 MCP 服务器...</div>
            </div>
          </div>
          <div class="pane" id="pane-logs">
            <div id="logs" class="logs-container">
              <div class="log-entry info">
                <span class="timestamp">[开始]</span>
                <span class="message">MCP 测试工具已加载</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
